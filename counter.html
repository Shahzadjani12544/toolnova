<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word & Character Counter - ToolNova</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    color:#222;
}

p{
    color:#666;
}

textarea{
    width:100%;
    height:220px;
    box-sizing:border-box;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    resize:vertical;
    font-size:16px;
    outline:none;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.stat{
    background:#f1f5f9;
    padding:15px;
    border-radius:10px;
}

.number{
    display:block;
    font-size:24px;
    font-weight:bold;
    margin-bottom:5px;
}

.label{
    color:#666;
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="container">

<h1>Word & Character Counter</h1>

<p>Type or paste your text below.</p>

<textarea id="text" placeholder="Start typing here..." oninput="countText()"></textarea>

<div class="stats">

<div class="stat">
<span class="number" id="words">0</span>
<span class="label">Words</span>
</div>

<div class="stat">
<span class="number" id="characters">0</span>
<span class="label">Characters</span>
</div>

<div class="stat">
<span class="number" id="charactersNoSpaces">0</span>
<span class="label">Characters (No Spaces)</span>
</div>

<div class="stat">
<span class="number" id="sentences">0</span>
<span class="label">Sentences</span>
</div>

</div>

<button onclick="clearText()">Clear Text</button>

</div>

<script>

function countText(){

    const text = document.getElementById("text").value;

    const words = text.trim() === ""
        ? 0
        : text.trim().split(/\s+/).length;

    const characters = text.length;

    const charactersNoSpaces =
        text.replace(/\s/g, "").length;

    const sentences = text.trim() === ""
        ? 0
        : (text.match(/[.!?]+/g) || []).length;

    document.getElementById("words").textContent = words;
    document.getElementById("characters").textContent = characters;
    document.getElementById("charactersNoSpaces").textContent = charactersNoSpaces;
    document.getElementById("sentences").textContent = sentences;
}

function clearText(){

    document.getElementById("text").value = "";
    countText();

}

</script>

</body>
</html>
