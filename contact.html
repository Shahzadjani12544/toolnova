<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Contact ToolNova - Get in touch with the ToolNova team.">

<title>Contact Us - ToolNova</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#222;
    line-height:1.6;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 20px;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.container{
    max-width:650px;
    margin:40px auto;
    padding:30px;
    background:white;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h1{
    margin-top:0;
}

input,
textarea{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    font-family:Arial,sans-serif;
}

textarea{
    height:160px;
    resize:vertical;
}

button{
    padding:12px 22px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.note{
    background:#f1f5f9;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    color:#555;
}

footer{
    background:#111827;
    color:#d1d5db;
    text-align:center;
    padding:25px 20px;
    margin-top:40px;
}
</style>
</head>

<body>

<header>
    <div class="logo">🚀 ToolNova</div>
</header>

<div class="container">

<h1>Contact Us</h1>

<p>
Have a question, suggestion, or found a problem with one of our tools?
We would love to hear from you.
</p>

<div class="note">
Please use the form below to send us your message.
</div>

<form action="https://formsubmit.co/" method="POST">

<input
type="text"
name="name"
placeholder="Your Name"
required
>

<input
type="email"
name="email"
placeholder="Your Email"
required
>

<textarea
name="message"
placeholder="Write your message here..."
required
></textarea>

<button type="submit">
Send Message
</button>

</form>

</div>

<footer>
    © 2026 ToolNova. All rights reserved.
</footer>

</body>
</html>
