<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor - ToolNova</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:white;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.logo{font-size:25px;font-weight:bold}.logo span{color:#2563eb}
header a{text-decoration:none;color:#172033}
.container{max-width:700px;margin:50px auto;padding:20px}
.box{background:white;padding:30px;border-radius:18px;box-shadow:0 5px 25px #0001;text-align:center}
h1{font-size:32px;margin-bottom:10px}
.subtitle{color:#667085;margin-bottom:25px}
input[type=file]{display:none}
.upload{display:block;padding:18px;border:2px dashed #2563eb;border-radius:12px;cursor:pointer;color:#2563eb;font-weight:bold;margin-bottom:20px}
.quality{margin:20px 0;text-align:left}
.quality input{width:100%}
button,.download{border:0;background:#2563eb;color:white;padding:13px 22px;border-radius:9px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{background:#9ca3af;cursor:not-allowed}
#result{margin-top:25px;display:none}
#preview{max-width:100%;max-height:250px;margin:15px auto;border-radius:10px}
.info{margin:12px 0;color:#475467}
.download{margin-top:10px}
</style>
</head>

<body>

<header>
<div class="logo">Tool<span>Nova</span></div>
<a href="index.html">← Home</a>
</header>

<div class="container">
<div class="box">

<h1>🖼️ Image Compressor</h1>
<p class="subtitle">Compress your images quickly and for free.</p>

<label class="upload" for="file">
📁 Choose an Image
</label>

<input id="file" type="file" accept="image/*">

<div class="quality">
<label>Compression Quality: <strong id="qualityText">70%</strong></label>
<input id="quality" type="range" min="10" max="100" value="70">
</div>

<button id="compress" disabled>Compress Image</button>

<div id="result">
<img id="preview">
<p class="info" id="info"></p>
<a id="download" class="download">⬇️ Download Compressed Image</a>
</div>

</div>
</div>

<script>
const fileInput=document.getElementById("file");
const quality=document.getElementById("quality");
const qualityText=document.getElementById("qualityText");
const compressBtn=document.getElementById("compress");
const result=document.getElementById("result");
const preview=document.getElementById("preview");
const info=document.getElementById("info");
const download=document.getElementById("download");

let selectedFile=null;

quality.oninput=()=>{
 qualityText.textContent=quality.value+"%";
};

fileInput.onchange=()=>{
 selectedFile=fileInput.files[0];
 if(selectedFile){
   compressBtn.disabled=false;
   result.style.display="none";
 }
};

compressBtn.onclick=()=>{
 if(!selectedFile)return;

 const reader=new FileReader();

 reader.onload=e=>{
   const img=new Image();

   img.onload=()=>{
     const canvas=document.createElement("canvas");
     const ctx=canvas.getContext("2d");

     canvas.width=img.width;
     canvas.height=img.height;

     ctx.drawImage(img,0,0);

     const q=Number(quality.value)/100;

     canvas.toBlob(blob=>{
       const oldSize=(selectedFile.size/1024).toFixed(1);
       const newSize=(blob.size/1024).toFixed(1);

       preview.src=URL.createObjectURL(blob);

       info.textContent=
       "Original: "+oldSize+" KB → Compressed: "+newSize+" KB";

       download.href=URL.createObjectURL(blob);
       download.download="toolnova-compressed.jpg";

       result.style.display="block";
     },"image/jpeg",q);
   };

   img.src=e.target.result;
 };

 reader.readAsDataURL(selectedFile);
};
</script>

</body>
</html>
