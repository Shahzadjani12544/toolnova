<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator - ToolNova</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    color:#222;
}

p{
    color:#666;
}

textarea{
    width:100%;
    height:100px;
    padding:12px;
    box-sizing:border-box;
    border:1px solid #ddd;
    border-radius:10px;
    resize:none;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#qrcode{
    margin:25px auto;
    display:flex;
    justify-content:center;
}

.download{
    display:none;
    background:#16a34a;
}
</style>
</head>

<body>

<div class="container">

<h1>QR Code Generator</h1>

<p>Enter text or a website link and generate your QR code.</p>

<textarea id="text" placeholder="Enter text or URL here..."></textarea>

<br>

<button onclick="generateQR()">Generate QR Code</button>

<div id="qrcode"></div>

<button id="downloadBtn" class="download" onclick="downloadQR()">
Download QR Code
</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function generateQR(){

    const text = document.getElementById("text").value.trim();
    const qr = document.getElementById("qrcode");
    const downloadBtn = document.getElementById("downloadBtn");

    if(text === ""){
        alert("Please enter some text or a URL.");
        return;
    }

    qr.innerHTML = "";

    new QRCode(qr,{
        text:text,
        width:220,
        height:220,
        colorDark:"#000000",
        colorLight:"#ffffff",
        correctLevel:QRCode.CorrectLevel.H
    });

    downloadBtn.style.display = "inline-block";
}

function downloadQR(){

    const canvas = document.querySelector("#qrcode canvas");

    if(!canvas){
        alert("Please generate a QR code first.");
        return;
    }

    const link = document.createElement("a");
    link.download = "toolnova-qr-code.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>

</body>
</html>
