<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter - ToolNova</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:550px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    color:#222;
}

p{
    color:#666;
}

select,input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    margin:8px 0 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.result{
    margin-top:20px;
    padding:18px;
    background:#f1f5f9;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Unit Converter</h1>

<p>Convert Length, Weight and Temperature.</p>

<select id="category" onchange="updateUnits()">
    <option value="length">Length</option>
    <option value="weight">Weight</option>
    <option value="temperature">Temperature</option>
</select>

<input type="number" id="value" placeholder="Enter value">

<select id="from"></select>

<select id="to"></select>

<br>

<button onclick="convert()">Convert</button>

<div class="result" id="result">
Result will appear here
</div>

</div>

<script>

const units = {

    length: [
        ["Meter","meter"],
        ["Kilometer","kilometer"],
        ["Centimeter","centimeter"],
        ["Millimeter","millimeter"],
        ["Mile","mile"],
        ["Yard","yard"],
        ["Foot","foot"],
        ["Inch","inch"]
    ],

    weight: [
        ["Kilogram","kilogram"],
        ["Gram","gram"],
        ["Milligram","milligram"],
        ["Pound","pound"],
        ["Ounce","ounce"]
    ],

    temperature: [
        ["Celsius","celsius"],
        ["Fahrenheit","fahrenheit"],
        ["Kelvin","kelvin"]
    ]

};

function updateUnits(){

    const category =
        document.getElementById("category").value;

    const from =
        document.getElementById("from");

    const to =
        document.getElementById("to");

    from.innerHTML = "";
    to.innerHTML = "";

    units[category].forEach(unit => {

        const option1 =
            document.createElement("option");

        option1.textContent = unit[0];
        option1.value = unit[1];

        const option2 =
            document.createElement("option");

        option2.textContent = unit[0];
        option2.value = unit[1];

        from.appendChild(option1);
        to.appendChild(option2);

    });

    if(to.options.length > 1){
        to.selectedIndex = 1;
    }

}

function convert(){

    const category =
        document.getElementById("category").value;

    const value =
        parseFloat(document.getElementById("value").value);

    const from =
        document.getElementById("from").value;

    const to =
        document.getElementById("to").value;

    const result =
        document.getElementById("result");

    if(isNaN(value)){
        result.textContent = "Please enter a value.";
        return;
    }

    let answer;

    if(category === "length"){
        answer = convertLength(value,from,to);
    }

    if(category === "weight"){
        answer = convertWeight(value,from,to);
    }

    if(category === "temperature"){
        answer = convertTemperature(value,from,to);
    }

    result.textContent =
        value + " " + from + " = " +
        Number(answer.toFixed(6)) + " " + to;
}

function convertLength(value,from,to){

    const meter = {

        meter:1,
        kilometer:1000,
        centimeter:0.01,
        millimeter:0.001,
        mile:1609.344,
        yard:0.9144,
        foot:0.3048,
        inch:0.0254

    };

    return value * meter[from] / meter[to];
}

function convertWeight(value,from,to){

    const kilogram = {

        kilogram:1,
        gram:0.001,
        milligram:0.000001,
        pound:0.45359237,
        ounce:0.028349523125

    };

    return value * kilogram[from] / kilogram[to];
}

function convertTemperature(value,from,to){

    let celsius;

    if(from === "celsius"){
        celsius = value;
    }

    if(from === "fahrenheit"){
        celsius = (value - 32) * 5 / 9;
    }

    if(from === "kelvin"){
        celsius = value - 273.15;
    }

    if(to === "celsius"){
        return celsius;
    }

    if(to === "fahrenheit"){
        return (celsius * 9 / 5) + 32;
    }

    if(to === "kelvin"){
        return celsius + 273.15;
    }
}

updateUnits();

</script>

</body>
</html>
