<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - ToolNova</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    color:#222;
}

p{
    color:#666;
}

.password{
    background:#f1f5f9;
    padding:15px;
    border-radius:10px;
    margin:20px 0;
    word-break:break-all;
    font-size:18px;
    font-weight:bold;
}

label{
    display:block;
    margin:15px 0 8px;
}

input[type="range"]{
    width:100%;
}

button{
    margin:8px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.copy{
    background:#16a34a;
}
</style>
</head>

<body>

<div class="container">

<h1>Password Generator</h1>

<p>Create a strong and random password.</p>

<div class="password" id="password">
Click Generate Password
</div>

<label>
Password Length:
<strong id="lengthValue">16</strong>
</label>

<input
type="range"
id="length"
min="6"
max="50"
value="16"
oninput="updateLength()"
>

<br>

<button onclick="generatePassword()">
Generate Password
</button>

<button class="copy" onclick="copyPassword()">
Copy Password
</button>

</div>

<script>

const lengthSlider = document.getElementById("length");
const lengthValue = document.getElementById("lengthValue");
const passwordBox = document.getElementById("password");

function updateLength(){
    lengthValue.textContent = lengthSlider.value;
}

function generatePassword(){

    const length = parseInt(lengthSlider.value);

    const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
    "abcdefghijklmnopqrstuvwxyz" +
    "0123456789" +
    "!@#$%^&*()_+-=[]{}|;:,.<>?";

    let password = "";

    for(let i = 0; i < length; i++){
        const randomIndex =
        Math.floor(Math.random() * characters.length);

        password += characters[randomIndex];
    }

    passwordBox.textContent = password;
}

function copyPassword(){

    const password = passwordBox.textContent;

    if(password === "Click Generate Password"){
        alert("Please generate a password first.");
        return;
    }

    navigator.clipboard.writeText(password)
    .then(() => {
        alert("Password copied!");
    })
    .catch(() => {
        alert("Copy failed. Please copy it manually.");
    });
}

</script>

</body>
</html>
